services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cata-pg
    restart: unless-stopped
    ports:
      # 5433 a propósito — no chocar con Postgres/Supabase en 5432.
      - "5433:5432"
    environment:
      POSTGRES_USER: cata
      POSTGRES_PASSWORD: cata_dev
      POSTGRES_DB: cata_learning
    volumes:
      - cata_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cata -d cata_learning"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cata_pg_data:
